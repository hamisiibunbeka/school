<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#4361ee" />
        <title>You're offline</title>
        <style>
            :root { color-scheme: light dark; }
            * { box-sizing: border-box; }
            body {
                margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
                font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
                background: #fafafa; color: #0e1726;
            }
            @media (prefers-color-scheme: dark) { body { background: #060818; color: #e0e6ed; } .card { background: #0e1726 !important; } p { color: #888ea8 !important; } }
            .card { max-width: 420px; width: 100%; background: #fff; border-radius: 16px; padding: 40px 28px; text-align: center; box-shadow: 0 30px 80px -30px rgba(67, 97, 238, .35); }
            img { width: 72px; height: 72px; border-radius: 18px; }
            h1 { font-size: 22px; margin: 20px 0 8px; }
            p { color: #888ea8; line-height: 1.6; margin: 0 0 24px; }
            button {
                border: 0; cursor: pointer; color: #fff; font-weight: 700; font-size: 14px; padding: 12px 22px; border-radius: 8px;
                background: linear-gradient(90deg, #ef1262, #4361ee); box-shadow: 0 10px 20px -10px rgba(67, 97, 238, .6);
            }
        </style>
    </head>
    <body>
        <div class="card">
            <img src="/icons/icon-192.png" alt="" />
            <h1>You're offline</h1>
            <p>The school system needs an internet connection to load records safely. Check your connection and try again — nothing you saved has been lost.</p>
            <button type="button" onclick="location.reload()">Try again</button>
        </div>
        <script>window.addEventListener('online', () => location.reload());</script>
    </body>
</html>
